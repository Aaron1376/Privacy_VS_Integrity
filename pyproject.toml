[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvi"
version = "0.1.0"
description = "Privacy versus Integrity: governance audit and threat-mapping simulations for cross-device federated keyboard learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.2", "matplotlib>=3.8", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
